services:
  postgres:
    image: postgres:17-alpine
    container_name: cagnotte-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: cagnotte
      POSTGRES_USER: cagnotte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - cagnotte-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cagnotte -d cagnotte"]
      interval: 10s
      timeout: 5s
      retries: 5

  cagnotte:
    build: .
    image: cagnotte:latest
    container_name: cagnotte
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9023:9021"
    environment:
      DATABASE_URL: postgres://cagnotte:${POSTGRES_PASSWORD}@postgres:5432/cagnotte
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      RUST_LOG: ${RUST_LOG:-info,cagnotte=info}
      PORT: 9021
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9021/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cagnotte-pgdata:
